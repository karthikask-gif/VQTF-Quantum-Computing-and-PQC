<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>VQTF Courses</title>
<style>
:root{--bg:#f6f7fb;--sf:#fff;--tx:#1b2033;--mu:#5a6280;--ac:#5b4bdb;--bd:#e0e3ee}
@media (prefers-color-scheme:dark){:root{--bg:#0f1220;--sf:#181c30;--tx:#e8eaf6;--mu:#9aa2c4;--ac:#9a8cff;--bd:#2a2f4a}}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,sans-serif}
header{background:linear-gradient(135deg,#2a1f8f,#0b7f86);color:#fff;text-align:center;padding:40px 16px}
h1{margin:0;font-size:clamp(1.8rem,5vw,2.6rem)}main{max-width:820px;margin:0 auto;padding:24px 16px;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}

a h2{margin:0 0 6px;color:var(--ac)}a p{margin:0;color:var(--mu)}
</style></head><body>
<header><h1>VQTF Courses</h1><p>Beginner-friendly courses with worked numbers and animations.</p></header>
<main>
<a href="quantum-computing/"><h2>Quantum Computing</h2><p>Qubits, the maths behind them, gates, the rules of the quantum world and quantum algorithms.</p></a>
